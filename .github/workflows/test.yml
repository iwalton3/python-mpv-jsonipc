# The Windows legs are the point of this file.
#
# `WindowsSocket` is a separate implementation from `UnixSocket`, built on
# `_winapi` and `multiprocessing.connection.PipeConnection` -- a private C
# extension and an undocumented class that is not in that module's `__all__`.
# Neither carries a compatibility guarantee, which means this library can break
# on a *Python* upgrade with no change of ours and no deprecation warning to
# read. Roughly 78 repositories depend on this module, several unmaintained, so
# "we find out when a user reports it" is not an acceptable detector.
#
# Hence: a wide Python matrix on Windows, a scheduled run so the alarm goes off
# without a commit, and a frozen-binary job because "works under PyInstaller
# with no dependencies" is the property people actually adopted this for and
# nothing else here can see it.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays. Nothing in the repo changes between these runs; the
    # interpreters underneath it do.
    - cron: '0 6 * * 1'

env:
  # Pinned for two reasons. The mild one: a per-PR failure should mean "we
  # broke it", not "mpv shipped today". The load-bearing one: shinchiro's
  # builds from 20260808 onward link vulkan-1.dll as a HARD import, and the
  # Vulkan loader is a driver-installed system component that a CI runner has
  # no reason to have -- so a newer mpv simply refuses to start there, and
  # every live test would fail for a reason that has nothing to do with this
  # library. 20260610 is the last clean release. jellyfin-mpv-shim pins the
  # same build for the same regression; raise both together once upstream is
  # fixed.
  MPV_WINDOWS_RELEASE: '20260610'
  # Turns "no mpv found" from a skip into a hard error. Without it, a wrong
  # MPV_BINARY skips every live test and the build goes green having tested
  # nothing -- the most expensive kind of passing CI.
  REQUIRE_MPV: '1'

jobs:
  linux:
    runs-on: ubuntu-latest
    # A hung job otherwise sits on a runner for six hours. These have wedged
    # in apt more than once while the test step -- 12 seconds -- had not even
    # started.
    #
    # Deliberately LARGER than the step timeouts below (12 + 10 + setup), so
    # a stall fails the step that caused it, by name. A job timeout smaller
    # than its steps' reports a "cancelled" job and hides which step stalled,
    # which is how the first of these was nearly misread as someone pressing
    # cancel.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install mpv
        # This step has hung twice, and DEBIAN_FRONTEND alone did not stop
        # it -- so an interactive prompt is not the cause, and the remaining
        # suspects are apt lock contention (the runner's own unattended
        # upgrades) and a stalled mirror. Rather than guess which, defend
        # against both and bound the whole thing:
        #   - the background apt services are stopped first;
        #   - DPkg::Lock::Timeout waits for a lock instead of blocking
        #     forever, then gives up;
        #   - Acquire::Retries survives a flaky mirror;
        #   - each attempt gets `timeout`, and there are two attempts, so a
        #     stalled mirror costs minutes rather than the job;
        #   - timeout-minutes fails THIS step by name. Without it the job
        #     timeout fires instead and reports a cancelled job, which reads
        #     like someone pressed cancel.
        # Measured: ~4 minutes when healthy, 14m57s when not.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service \
            unattended-upgrades.service 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service 2>/dev/null || true
          install_mpv() {
            sudo timeout 240 apt-get -o DPkg::Lock::Timeout=120 \
              -o Acquire::Retries=3 update
            sudo timeout 300 apt-get -o DPkg::Lock::Timeout=120 \
              -o Acquire::Retries=3 install -y --no-install-recommends \
              -o Dpkg::Options::=--force-confnew mpv
          }
          install_mpv || { echo "::warning::apt stalled; retrying once"; install_mpv; }
          mpv --version | head -1
      - name: Run tests
        # No xvfb: every live test runs mpv with --vo=null, so nothing opens
        # a window.
        timeout-minutes: 10
        run: python -m unittest discover tests -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Wider than Linux on purpose -- this is the axis the private-API
        # dependency actually breaks along.
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Download mpv
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # The plain x86_64 build, not -v3: that one targets a newer
          # microarchitecture level and the pattern must not match it.
          gh release download "$env:MPV_WINDOWS_RELEASE" `
            --repo shinchiro/mpv-winbuild-cmake `
            --pattern 'mpv-x86_64-2*.7z' --dir mpv-dist
          7z x mpv-dist\*.7z -ompv
          # Found, not assumed: if the archive ever grows a top-level
          # directory, a hard-coded path would silently point at nothing.
          $exe = (Get-ChildItem -Path mpv -Recurse -Filter mpv.exe |
                  Select-Object -First 1).FullName
          if (-not $exe) { throw "mpv.exe not found after extraction" }
          "MPV_BINARY=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run tests
        shell: pwsh
        timeout-minutes: 10
        run: python -m unittest discover tests -v

  windows-python-prerelease:
    # The early-warning leg, and deliberately NOT continue-on-error.
    #
    # It cannot block anyone: it never runs on push or pull_request. So the
    # only thing `continue-on-error` bought was a green run containing a red
    # job -- and GitHub notifies on a failed *run*, not on a failed job inside
    # a passing one. An early warning nobody is told about warns nobody, which
    # would have quietly defeated the entire point of this job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.15-dev']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Download mpv
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download "$env:MPV_WINDOWS_RELEASE" `
            --repo shinchiro/mpv-winbuild-cmake `
            --pattern 'mpv-x86_64-2*.7z' --dir mpv-dist
          7z x mpv-dist\*.7z -ompv
          $exe = (Get-ChildItem -Path mpv -Recurse -Filter mpv.exe |
                  Select-Object -First 1).FullName
          if (-not $exe) { throw "mpv.exe not found after extraction" }
          "MPV_BINARY=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run tests
        shell: pwsh
        timeout-minutes: 10
        run: python -m unittest discover tests -v

  windows-frozen:
    timeout-minutes: 15
    # "Works on Windows, frozen, with zero dependencies" is why this library
    # exists -- it was chosen over pywin32 precisely to avoid the PyInstaller
    # tax. The golden API snapshot cannot see a packaging regression; this can.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download mpv
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download "$env:MPV_WINDOWS_RELEASE" `
            --repo shinchiro/mpv-winbuild-cmake `
            --pattern 'mpv-x86_64-2*.7z' --dir mpv-dist
          7z x mpv-dist\*.7z -ompv
          # Found, not assumed: if the archive ever grows a top-level
          # directory, a hard-coded path would silently point at nothing.
          $exe = (Get-ChildItem -Path mpv -Recurse -Filter mpv.exe |
                  Select-Object -First 1).FullName
          if (-not $exe) { throw "mpv.exe not found after extraction" }
          "MPV_BINARY=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Freeze a client with PyInstaller
        run: |
          # Install rather than freezing from the checkout: PyInstaller's
          # analysis is static, so it cannot follow a runtime sys.path
          # insert and would bundle no library at all. Installing first is
          # also what a downstream project actually does.
          pip install . pyinstaller
          pyinstaller --onefile --name freeze_smoke tests/freeze_smoke.py
      - name: Run the frozen client against real mpv
        shell: pwsh
        run: .\dist\freeze_smoke.exe
